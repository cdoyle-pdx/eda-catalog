---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: polybiusconfigs.polybius.cdoyle.dev
spec:
  group: polybius.cdoyle.dev
  names:
    kind: PolybiusConfig
    listKind: PolybiusConfigList
    plural: polybiusconfigs
    singular: polybiusconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PolybiusConfig is the Schema for the polybiusconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PolybiusConfigSpec holds the settings an operator may want to change without
              rebuilding the image. Every field is optional, and so is the resource: with
              no PolybiusConfig the game uses the defaults below.

              The game reads the first PolybiusConfig it finds (create one, named default,
              in the eda namespace). Changes apply the next time the game page loads.
            properties:
              autoFire:
                description: |-
                  AutoFire is the auto-fire setting each page load of the game starts with. Off (the default): Space
                  fires, held to keep firing. On: the guns fire on their own. Players can switch it on the title screen
                  (Space) until the page is reloaded; a game keeps the setting it started with.
                type: boolean
              boardSize:
                default: 10
                description: BoardSize is how many entries the leaderboard shows,
                  from 3 to 10.
                maximum: 10
                minimum: 3
                type: integer
              defaultPace:
                description: |-
                  DefaultPace is the pace a new browser starts on. arcade is the full game:
                  a system query every 2-3.5 min, a mode change every 90-145 s,
                  achievements, and the Arcade ending. booth is the show-floor cabinet: a
                  query every 1-2 min, a mode change every 60-90 s, no achievements, and the
                  Booth ending. A player's own choice wins; it applies from the next game.
                enum:
                - arcade
                - booth
                type: string
              defaultWindow:
                description: |-
                  DefaultWindow is no longer used (since v1.3.0 the system-query timer is
                  set by defaultPace) and is kept so existing configs still apply.
                enum:
                - standard
                - demo
                type: string
              devTools:
                description: |-
                  DevTools shows the test controls under the game screen (test
                  interrogation, test crash, jump to mode, unlock, reset). Off by default.
                type: boolean
              eventKeep:
                default: 200
                description: |-
                  EventKeep is how many PolybiusEvent resources to keep in the score namespace; the game deletes the
                  oldest beyond this.
                maximum: 2000
                minimum: 20
                type: integer
              nodePings:
                description: |-
                  NodePings lets the Fabric Crawl run EDA Ping workflows between the real fabric nodes on the board and show
                  the replies (success, latency, jitter) as the fabric's pulse. A ping configures nothing on the nodes. Each
                  workflow is deleted once its result is read. Off by default.
                type: boolean
              pingNetworkInstance:
                description: |-
                  PingNetworkInstance is the network instance the pings use. Default "mgmt": the nodes ping each other's
                  management addresses (from each TopoNode's status).
                type: string
              profileNamespace:
                default: eda
                description: |-
                  ProfileNamespace is where PolybiusProfile resources are kept. It is
                  separate from ScoreNamespace so achievements follow players across boards.
                type: string
              scoreNamespace:
                default: eda
                description: |-
                  ScoreNamespace is where PolybiusScore resources are written and read.
                  Point it at a fresh namespace to give an event its own leaderboard.
                type: string
              scoreTransactions:
                description: |-
                  ScoreTransactions writes each saved score as its own named EDA transaction ("Polybius: ALICE scored
                  120170 in sector 4") and shows the transaction on the leaderboard. Off by default, so playing the game
                  adds no named entries to EDA's transaction history.
                type: boolean
              telemetry:
                description: Telemetry turns the game's PolybiusEvent log on or off.
                  Unset means on.
                type: boolean
            type: object
          status:
            description: |-
              PolybiusConfigStatus is intentionally empty: nothing reconciles a
              PolybiusConfig.
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
