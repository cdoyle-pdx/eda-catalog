---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: polybiusprofiles.polybius.cdoyle.dev
spec:
  group: polybius.cdoyle.dev
  names:
    kind: PolybiusProfile
    listKind: PolybiusProfileList
    plural: polybiusprofiles
    singular: polybiusprofile
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PolybiusProfile is the Schema for the polybiusprofiles API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PolybiusProfileSpec is one EDA user's saved progress: achievements, unlocked
              modes, question decks, play time and the other things that should follow a
              player from browser to browser.

              The game creates and updates one profile per EDA user, named
              u-<username>-<hash>, the first time that user plays. Deleting a profile
              resets that user's progress; it does not touch the leaderboard.

              The summary fields (achievements, bestScore, crowned, playMinutes) are there
              to read in the EDA UI and in queries. The game itself restores from state.
            properties:
              achievementCount:
                description: AchievementCount is how many of the game's achievements
                  are unlocked.
                minimum: 0
                type: integer
              achievements:
                description: Achievements lists the ids of the unlocked achievements,
                  sorted.
                items:
                  type: string
                type: array
              bestScore:
                description: BestScore is the user's highest recorded score.
                minimum: 0
                type: integer
              crowned:
                description: Crowned is true once the user has defeated IT in the
                  air strike.
                type: boolean
              edaUser:
                description: EdaUser is the EDA username this profile belongs to.
                type: string
              playMinutes:
                description: PlayMinutes is the user's total time in play, in minutes.
                minimum: 0
                type: integer
              state:
                description: |-
                  State is the game's full saved state for this user, as a JSON string.
                  The game owns its format; edit it only to repair a profile.
                type: string
              updatedAt:
                description: UpdatedAt is when the game last saved this profile, as
                  RFC3339.
                type: string
            required:
            - edaUser
            type: object
          status:
            description: |-
              PolybiusProfileStatus is intentionally empty: nothing reconciles a
              PolybiusProfile.
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
